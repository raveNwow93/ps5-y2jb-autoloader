<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y2JB Media Diagnostics</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font:20px Arial,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#05070c}
#panel{position:fixed;left:3%;right:3%;bottom:3%;max-height:44%;overflow:hidden;background:rgba(0,0,0,.88);border:2px solid #83baff;border-radius:12px;padding:16px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.35}
h1{font-size:22px;margin:0 0 8px;color:#83baff}
</style>
</head>
<body>
<video id="video" autoplay muted loop playsinline>
<source src="assets/background.mp4" type='video/mp4; codecs="avc1.42E01E"'>
</video>
<div id="panel"><h1>Y2JB MEDIA DIAGNOSTICS</h1><div id="out">Starting tests...</div></div>
<script>
(function(){
 var v=document.getElementById('video'), out=document.getElementById('out');
 var lines=[];
 function log(s){lines.push(s);if(lines.length>15)lines.shift();out.textContent=lines.join('\n');}
 function run(){
  log('User-Agent: '+navigator.userAgent);
  log('Platform: '+(navigator.platform||'unknown'));
  log('MP4/H.264: '+(v.canPlayType('video/mp4; codecs="avc1.42E01E"')||'not supported'));
  log('Media API: '+(typeof HTMLMediaElement));
  log('Autoplay allowed: '+String(v.autoplay));
  log('Muted: '+String(v.muted));
  log('Source: '+v.currentSrc);
  log('Initial readyState: '+v.readyState);
  log('Initial networkState: '+v.networkState);
 }
 ['loadstart','loadedmetadata','loadeddata','canplay','play','playing','pause','stalled','waiting','suspend','ended','error'].forEach(function(e){
  v.addEventListener(e,function(){
   var s='EVENT '+e+' | ready='+v.readyState+' network='+v.networkState+' time='+v.currentTime.toFixed(2);
   if(v.error)s+=' mediaError='+v.error.code;
   log(s);
  });
 });
 window.addEventListener('error',function(e){log('JS ERROR: '+(e.message||'unknown'));});
 run();
 setTimeout(function(){
  log('After 5s: paused='+v.paused+' ready='+v.readyState+' network='+v.networkState);
  if(v.error)log('Media error code: '+v.error.code);
 },5000);
})();
</script>
</body>
</html>
