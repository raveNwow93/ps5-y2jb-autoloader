name: Build download0 artifact

on:
  workflow_dispatch:

# This workflow deliberately has no write permission and does not create tags or releases.
permissions:
  contents: read

jobs:
  build-download0:
    name: Build y2jb_update and download0.dat
    runs-on: ubuntu-latest

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build update package
        run: bash ./build.sh --dev --download-deps

      - name: Assemble YouTube download0 tree
        shell: bash
        run: |
          set -euo pipefail
          splash_dir='download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY='
          mkdir -p "$splash_dir"
          unzip -q y2jb_update.zip -d "$splash_dir"
          rm -f "$splash_dir/update-info.txt"

      - name: Create UFS2 download0.dat in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -eu
            truncate -s 336789504 download0.dat
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")
            newfs -O 2 -b 32768 -f 4096 "/dev/${MD}"
            mount "/dev/${MD}" /mnt
            cp -R download0/. /mnt/
            chmod -R 777 /mnt
            umount /mnt
            mdconfig -d -u "${MD}"

      - name: Verify the image
        run: file download0.dat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: y2jb-download0-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            y2jb_update.zip
            download0.dat
